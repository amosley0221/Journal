# Render Blueprint — deploys Journal+ as a static site.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: journal-plus
    runtime: static
    # No build step — we serve the files in the repo as-is.
    buildCommand: ""
    staticPublishPath: .
    # Send every unknown URL to index.html (so PWA navigations work).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /*.jsx
        name: Content-Type
        value: text/babel; charset=utf-8
